<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spidey Web Shooter</title>
    <!-- p5.js core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0f0f18;
        }

        canvas {
            display: block;
        }

        #back-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 8px 16px;
            background: rgba(10, 15, 25, 0.85);
            color: #00e6ff;
            border: 1px solid #324664;
            border-radius: 6px;
            font-family: sans-serif;
            font-size: 13px;
            text-decoration: none;
            z-index: 10;
            transition: 0.2s background;
        }

        #back-btn:hover {
            background: rgba(0, 230, 255, 0.2);
        }
    </style>
</head>

<body>
    <a id="back-btn" href="/">← Return Home</a>
    <script src="sketch.js"></script>
</body>

</html>
