<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ascension Cards — Habit RPG</title>
    <meta http-equiv="refresh" content="0; url=/?tab=games&game=ascension-cards" />
    <script>
      // Seamless client-side redirect preserving base URL
      var target = window.location.pathname.replace(/\/ascensioncards\/?$/, "") + "/?tab=games&game=ascension-cards";
      window.location.replace(target);
    </script>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #090d16;
        color: #f1f5f9;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
        padding: 20px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-top-color: #38bdf8;
        animation: spin 1s ease-in-out infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      a {
        color: #38bdf8;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <h2>Ascension Cards</h2>
    <p>Åbner Ascension Cards i spilarkaden...</p>
    <p><a href="/?tab=games&game=ascension-cards">Klik her hvis du ikke omdirigeres automatisk</a></p>
  </body>
</html>
